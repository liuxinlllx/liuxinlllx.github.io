Core Challenges\n- Doctors don't understand exercise, and sports professionals don't understand medicine — how do we break down these professional silos?\n- The payment question: who pays for exercise prescriptions? Can health insurance cover them?\n- Standardization: what counts as a \"qualified\" exercise prescription?\n\n### My Reflections\nExercise is Medicine is not purely a sports issue — it is a social governance challenge. It requires cross-departmental coordination among health commissions, sports bureaus, and education departments. The researcher's mission is to provide quantifiable evidence that can drive policy innovation.\n\n## How to Listen\n\nThis episode is available on the Ximalaya platform — search for \"Sports Humanities Dialogue\" to listen.\n\n\u003e The audio file is a placeholder. Please place the actual audio in the `public/audio/` directory."])</script><script>self.__next_f.push([1,"7:T740,"])</script><script>self.__next_f.push([1,"About This Episode\n\"Exercise is Medicine\" is repeatedly mentioned in policy documents — but how far has it actually progressed in practice? In this episode, I draw on my own research experience to discuss the origins and evolution of this concept, as well as innovative practices emerging across China.\nKey Topics\nPolicy Timeline\n\n2016: The \"Healthy China 2030\" Planning Outline first incorporated \"sport-medicine integration\" into a national-level policy document\n2021: The National Fitness Plan (2021–2025) further emphasized \"Exercise is Medicine\"\nIn the upcoming 15th Five-Year Plan, Exercise is Medicine is expected to play an even more prominent role\n\nLocal Practice Cases\nZhejiang, Shanghai, Shenzhen, and other regions have begun piloting models that combine \"exercise prescription\" with community health management. Zhejiang's approach is particularly noteworthy — community health centers issue exercise prescriptions, and certified social sports instructors follow up on their implementation.\nCore e explores the policy trajectory and practical progress of Exercise is Medicine, sharing observations from sports industry expos and academic conferences.\",\"metadata\":{\"readingTime\":1,\"wordCount\":256},\"lang\":\"en\",\"slug\":\"tiyu-renwen-01\",\"body\":\"$6\",\"plain\":\"$7\"},{\"title\":\"体卫融合：从理念到实践，我们走了多远？\",\"date\":\"2025-05-01T00:00:00.000Z\",\"duration\":\"32:15\",\"audioUrl\":\"/audio/tiyu-renwen-01.mp3\",\"tags\":[\"体卫融合\",\"健康中国\",\"政策解读\"],\"excerpt\":\"第一期播客深入探讨体卫融合的政策脉络与实践进展，分享我在体博会和学术会议上的观察与思考。\",\"metadata\":{\"readingTime\":1,\"wordCount\":223.76},\"lang\":\"zh\",\"slug\":\"tiyu-renwen-01\",\"body\":\"## 本期简介\\n\\n\\\"体卫融合\\\"在政策文件中被反复提及，但在实践中到底推进到了什么程度？这一期，我从自己的研究经历出发，聊聊这个概念的来龙去脉，以及全国各地涌现的创新实践。\\n\\n## 本期要点\\n\\n### 政策时间线\\n- 2016年：《\\\"健康中国2030\\\"规划纲要》首次将\\\"体医融合\\\"写入国家顶层文件\\n- 2021年：《全民健身计划（2021-2025年）》进一步强调\\\"体卫融合\\\"\\n- \\\"十五五\\\"规划编制中，体卫融合预计会占据更重要的位置\\n\\n### 地方实践案例\\n浙江、上海、深圳等地已经开始试点\\\"运动处方\\\"与社区健康管理相结合的模式。浙江的做法尤其值得关注——让社区卫生服务中心开出运动处方，由社会体育指导员跟进执行。\\n\\n### 核心挑战\\n- 医生不懂运动，体育人不了解医学——专业壁垒如何打破？\\n- 支付问题：运动处方谁来买单？医保能不能覆盖？\\n- 标准化：什么样的运动处方是\\\"合格\\\"的？\\n\\n### 我的思考\\n体卫融合不是一个单纯的体育问题，而是一个社会治理课题。它需要卫健委、体育局、教育部的跨部门协同。研究者的使命是提供可量化的证据，从而推动政策创新。\\n\\n## 收听方式\\n\\n本期播客音频可在喜马拉雅平台搜索\\\"体育人文对话\\\"收听。\\n\\n\u003e 音频文件为示例占位。实际音频请放入 `public/audio/` 目录。\",\"plain\":\"本期简介\\n\\\"体卫融合\\\"在政策文件中被反复提及，但在实践中到底推进到了什么程度？这一期，我从自己的研究经历出发，聊聊这个概念的来龙去脉，以及全国各地涌现的创新实践。\\n本期要点\\n政策时间线\\n\\n2016年：《\\\"健康中国2030\\\"规划纲要》首次将\\\"体医融合\\\"写入国家顶层文件\\n2021年：《全民健身计划（2021-2025年）》进一步强调\\\"体卫融合\\\"\\n\\\"十五五\\\"规划编制中，体卫融合预计会占据更重要的位置\\n\\n地方实践案例\\n浙江、上海、深圳等地已经开始试点\\\"运动处方\\\"与社区健康管理相结合的模式。浙江的做法尤其值得关注——让社区卫生服务中心开出运动处方，由社会体育指导员跟进执行。\\n核心挑战\\n\\n医生不懂运动，体育人不了解医学——专业壁垒如何打破？\\n支付问题：运动处方谁来买单？医保能不能覆盖？\\n标准化：什么样的运动处方是\\\"合格\\\"的？\\n\\n我的思考\\n体卫融合不是一个单纯的体育问题，而是一个社会治理课题。它需要卫健委、体育局、教育部的跨部门协同。研究者的使命是提供可量化的证据，从而推动政策创新。\\n收听方式\\n本期播客音频可在喜马拉雅平台搜索\\\"体育人文对话\\\"收听。\\n\\n音频文件为示例占位。实际音频请放入 public/audio/ 目录。\\n\"}]}],[\"$L8\",\"$L9\"],\"$La\"]}],{},null,false,null]},null,false,\"$@b\"]},null,fa
